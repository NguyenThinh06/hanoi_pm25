name: HANOI_PM25 CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb polars pyarrow geopandas shapely ruff pytest

      - name: Step 1 - Linting Check (ruff)
        run: python run.py lint

      - name: Step 2 - Unit Tests
        run: python run.py test