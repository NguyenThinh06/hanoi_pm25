dataContractSpecification: "3.0.0"
id: "urn:datacontract:hanoi_pm25:spatio_temporal_lakehouse"
info:
  title: "Hanoi PM2.5 Spatio-Temporal Data Lakehouse & 1km Surface Contract"
  version: "2.1.0"
  description: >
    Dac ta Hop dong Du lieu quan tri toan bo vong doi du lieu tu Bronze (Raw Ingestion),
    Silver (Staging QC), Gold (Core Star Schema) den Platinum (Feature Mart & Prediction Surface).
    Bao dam bat bien ma tran khong-thoi gian 3.610 o x 1.826 ngay = 6.591.860 dong
    va nguyen tac chong ro ri du lieu (Anti-Data-Leakage) cho Machine Learning.
    Luu y: Dac ta dang duoc thuc thi de kiem dinh tu dong cac thanh phan nen tang da hoan thanh cua TV1,
    dong thoi thiet lap tieu chuan nghiem thu cho TV2 va TV3. Toan bo hop dong o trang thai DRAFT
    cho phan bien va ky duyet chinh thuc giua cac thanh vien.
  domain: "environmental_and_urban_data_mesh"
  status: "draft"
  classification: "internal"
  updated_at: "2026-10-27T10:45:00Z"

# ==============================================================================
# 1. QUAN TRI CON NGUOI & MA TRAN PHAN QUYEN (RACI GOVERNANCE)
# ==============================================================================
stakeholders:
  - role: "Data Architect & CI/CD Lead (TV1)"
    owner: "ngthinh06"
    responsibilities:
      - "Quan tri runner run.py, CI/CD GitHub Actions, module bam SHA-256 luy dang."
      - "Bao dam khung luoi khong gian dim_grid_1km (EPSG:3405) va truc ngay 5 nam dim_date."
      - "Toan quyen chiu trach nhiem thu thap, lam sach chuoi gio va gom ngay tram quan trac mat dat (fct_ground_truth_daily, dim_station)."
      - "Thiet lap khung tham dinh mo hinh Spatial K-Fold Cross Validation va cac mo hinh Baseline."

  - role: "Urban Static & Satellite Features Owner (TV2)"
    owner: "hunganh"
    responsibilities:
      - "Trich xuat 15 bien tinh do thi (ESA WorldCover, OSM Road Network, NASA SRTM DEM) vao dim_grid_1km (Giai doan v1.1)."
      - "Thu thap va noi suy du lieu ve tinh quang hoc MODIS MAIAC AOD 550nm (fct_grid_satellite_daily)."
      - "Thuc thi Cong chat luong du lieu (Quality Gate) va Kiem thu dot bien (Mutation Testing)."

  - role: "Meteorology & Atmospheric Dynamics Owner (TV3)"
    owner: "minh"
    responsibilities:
      - "Thu thap du lieu tai phan tich khi tuong ECMWF ERA5-Land (fct_grid_meteo_daily)."
      - "Tinh toan cac bien chuyen hoa: Do am tuong doi RH (Magnus-Tetens), Do ben vung huong gio, Lop bien hanh tinh PBLH."
      - "Ban giao chuoi RH khi quyen dung han de phuc vu dong goi Feature Mart va nghien cuu mo hinh hieu chuan."

# ==============================================================================
# 2. CAM KET KIEN TRUC & DICH VU (SLA & ARCHITECTURAL INVARIANTS)
# ==============================================================================
serviceLevelAgreement:
  storageArchitecture: "Zero-RDBMS Lakehouse (Pure Apache Parquet / GeoParquet / DuckDB / Polars)"
  spatialReferenceSystem: "EPSG:3405 (VN-2000 / UTM Zone 48N, chuan don vi met)"
  temporalSpan:
    startDate: "2021-01-01"
    endDate: "2025-12-31"
    totalCalendarDays: 1826
    leapYearHandling: "Bao gom ngay nhuan 2024-02-29 (366 ngay)"
    localTimezone: "Asia/Ho_Chi_Minh (UTC+7)"
  
  invariants:
    gridResolutionMetres: 1000
    activeGridCellsCount: 3610
    totalGridCellsWithUnknown: 3611
    boundarySource: "HDX COD-AB v02 (GSO Vietnam, 01/07/2025)"
    boundarySha256: "d8194abcc1d89eadd836941a750ae339f398a9b2e5e9d2428d0f96f1f2bd1f77"
    totalSpineMatrixRows: 6591860  # 3.610 cells x 1.826 days
    zeroDropPolicyOnFeatures: "Nghiem cam moi thao tac DROP dong tren mart_grid_daily_features"
    antiLeakageConstraint: "Tuyet doi cam chua cot nhan PM2.5 trong mart_grid_daily_features"

# ==============================================================================
# 3. MO HINH DU LIEU & QUY CACH SCHEMA CHI TIET (MODELS SPECIFICATION)
# ==============================================================================
models:
  # ----------------------------------------------------------------------------
  # MODEL 1: KHUNG LUOI KHONG GIAN 1KM (v1.0 Spine -> v1.1 Enriched)
  # ----------------------------------------------------------------------------
  dim_grid_1km:
    description: "Bang chieu khong gian luoi 1km x 1km EPSG:3405 bao phu tron ven Ha Noi."
    path: "data/core/dim_grid_1km.parquet"
    format: "geoparquet"
    primaryKey: ["grid_id"]
    expectedRowCount: 3611
    columns:
      # Tầng 1: Khung xương không gian bất biến (Spine v1.0 - Do TV1 bàn giao)
      grid_id:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        description: "Ma dinh danh duy nhat cua o luoi (vi du: grid_584000_2324000; unknown: grid_unknown)."
      easting_m:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        description: "Toa do tam o luoi theo truc Dong (X) met VN-2000 UTM Zone 48N."
      northing_m:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        description: "Toa do tam o luoi theo truc Bac (Y) met VN-2000 UTM Zone 48N."
      is_canonical:
        type: "BOOLEAN"
        nullable: false
        stage: "v1.0"
        description: "True neu tam o nam ben trong ranh gioi Ha Noi (3.363 o)."
      area_in_boundary_km2:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        description: "Dien tich phan giao voi ranh gioi (0.0 den 1.0 km2)."
      geometry:
        type: "BLOB"
        nullable: true
        stage: "v1.0"
        description: "Hinh hoc WKB cua o luoi 1000m x 1000m."

      # Tầng 2: 15 Biến tĩnh đô thị bổ sung (Enrichment v1.1 - Do TV2 bàn giao)
      worldcover_builtup_ratio:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, 1.0]
        description: "Ty le dien tich xay dung do thi tu ESA WorldCover 10m."
      worldcover_tree_ratio:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, 1.0]
        description: "Ty le dien tich cay xanh tu ESA WorldCover 10m."
      worldcover_water_ratio:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, 1.0]
        description: "Ty le dien tich mat nuoc tu ESA WorldCover 10m."
      osm_primary_road_m:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, null]
        description: "Khoang cach ngan nhat toi truc duong chinh (m)."
      osm_road_density_km_km2:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, 100.0]
        description: "Mat do duong bo tren dien tich o (km/km2)."
      dem_elevation_mean_m:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [-5.0, 1300.0]
        description: "Do cao dia hinh trung binh tu NASA SRTM DEM 30m (m)."
      dem_slope_mean_deg:
        type: "FLOAT"
        nullable: true
        stage: "v1.1_tv2"
        range: [0.0, 60.0]
        description: "Do doc dia hinh trung binh (do)."

  # ----------------------------------------------------------------------------
  # MODEL 2: TRUC THOI GIAN 5 NAM BAT BIEN
  # ----------------------------------------------------------------------------
  dim_date:
    description: "Bang chieu thoi gian 5 nam lich 2021–2025 khong co ngay khuyet thieu."
    path: "data/core/dim_date.parquet"
    format: "parquet"
    primaryKey: ["date_id"]
    expectedRowCount: 1827  # 1.826 calendar days + 1 sentinel (-1)
    columns:
      date_id:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        description: "Khoa thay the nguyen dang YYYYMMDD (vi du 20240229; unknown: -1)."
      date_actual:
        type: "DATE"
        nullable: false
        stage: "v1.0"
        description: "Ngay duong lich chuan ISO-8601 (2021-01-01 den 2025-12-31)."
      year:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        range: [2021, 2025]
      month:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        range: [1, 12]
      day:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        range: [1, 31]
      day_of_week:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        range: [1, 7]
      is_weekend:
        type: "BOOLEAN"
        nullable: false
        stage: "v1.0"
      hanoi_season:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        allowedValues: ["Winter", "Spring", "Summer", "Autumn", "Unknown"]
      is_crop_burning_window:
        type: "BOOLEAN"
        nullable: false
        stage: "v1.0"
        description: "Cờ mùa vụ đốt rơm rạ ngoại thành Hà Nội (tháng 5-6 và tháng 9-10)."

  # ----------------------------------------------------------------------------
  # MODEL 3: DANH MUC TRAM QUAN TRAC MAT DAT
  # ----------------------------------------------------------------------------
  dim_station:
    description: >
      Danh muc cac tram quan trac mat dat khao sat trong bounding box Ha Noi tu OpenAQ API.
      Snapshot khao sat hien tai co 43 tram thuc + 1 station_unknown (so dong khong phai hang so bat bien).
    path: "data/core/dim_station.parquet"
    format: "parquet"
    primaryKey: ["station_id"]
    columns:
      station_id:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        description: "Ma duy nhat cua tram quan trac (vi du: openaq_7441; unknown: station_unknown)."
      station_name:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
      provider:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
      sensor_tier:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        allowedValues: ["Tier_1_Reference_FEM", "Tier_2_LowCost_Optical", "Unknown"]
      station_microenv_type:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        allowedValues: ["Urban_Background", "Roadside", "Rural_Background", "Unknown"]
      grid_id:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
        description: "Khoa ngoai tham chieu toi o luoi dim_grid_1km chua tram (Zero-Orphan guarantee)."
      lon_wgs84:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
      lat_wgs84:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
      easting_m:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
      northing_m:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
      is_active:
        type: "BOOLEAN"
        nullable: false
        stage: "v1.0"

  # ----------------------------------------------------------------------------
  # MODEL 4: BANG SU KIEN TRAM DO NGAY (TARGET VARIABLE)
  # ----------------------------------------------------------------------------
  fct_ground_truth_daily:
    description: "Bang Fact moi tram-ngay co quan sat trong 2021-2025; giu ca ngay duoi 18 gio va ngay khong co gio hop le."
    path: "data/core/fct_ground_truth_daily.parquet"
    format: "parquet"
    primaryKey: ["station_id", "date_id"]
    foreignKeys:
      - columns: ["grid_id"]
        reference: "dim_grid_1km.grid_id"
      - columns: ["date_id"]
        reference: "dim_date.date_id"
      - columns: ["station_id"]
        reference: "dim_station.station_id"
    columns:
      station_id:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
      date_id:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
      grid_id:
        type: "VARCHAR"
        nullable: false
        stage: "v1.0"
      valid_hours_count:
        type: "BIGINT"
        nullable: false
        stage: "v1.0"
        range: [0, 24]
        description: "So gio do sach duy nhat trong ngay."
      is_valid_day:
        type: "INTEGER"
        nullable: false
        stage: "v1.0"
        allowedValues: [0, 1]
        description: "1 neu co it nhat 18 gio hop le; 0 neu it hon. Chi la co chat luong, khong loc fact."
      pm25_raw_mean:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        range: [0.0, 1000.0]
        description: "Trung binh gio sach; NULL khi khong co gio hop le."
      pm25_daily_std:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        range: [0.0, null]
      pm25_daily_min:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        range: [0.0, 1000.0]
      pm25_daily_max:
        type: "DOUBLE"
        nullable: true
        stage: "v1.0"
        range: [0.0, 1000.0]

  # ----------------------------------------------------------------------------
  # MODEL 5: KHO DAC TRUNG HOC MAY BE MAT (FEATURE STORE - PLATINUM MART)
  # ----------------------------------------------------------------------------
  mart_grid_daily_features:
    description: "Bang dac trung thanh pham tai tang Platinum cung cap dau vao X cho mo hinh ML."
    path: "data/marts/mart_grid_daily_features.parquet"
    format: "parquet"
    primaryKey: ["grid_id", "date_id"]
    expectedRowCount: 6591860  # Dung 3.610 o x 1.826 ngay
    whitelistedColumnsOnly: true
    antiLeakageGuaranteed: true  # TUYET DOI CAM CO BAT KY COT PM2.5 NAO
    columns:
      # Khung khoa (Spine Keys)
      grid_id:
        type: "VARCHAR"
        nullable: false
      date_id:
        type: "INTEGER"
        nullable: false
      date:
        type: "DATE"
        nullable: false

      # Khi tuong ERA5-Land (TV3)
      temp_2m_mean_c:
        type: "FLOAT"
        nullable: true
        range: [5.0, 48.0]
        unit: "°C"
      dewpoint_2m_mean_c:
        type: "FLOAT"
        nullable: true
        range: [0.0, 35.0]
        unit: "°C"
      rh_mean_pct:
        type: "FLOAT"
        nullable: true
        range: [10.0, 100.0]
        unit: "%"
      precip_daily_mm:
        type: "FLOAT"
        nullable: true
        range: [0.0, 500.0]
        unit: "mm"
      wind_speed_scalar_ms:
        type: "FLOAT"
        nullable: true
        range: [0.0, 35.0]
        unit: "m/s"
      wind_persistence:
        type: "FLOAT"
        nullable: true
        range: [0.0, 1.0]
        unit: "ratio"
      surface_pressure_hpa:
        type: "FLOAT"
        nullable: true
        range: [950.0, 1050.0]
        unit: "hPa"
      blh_mean_m:
        type: "FLOAT"
        nullable: true
        range: [50.0, 3500.0]
        unit: "m"
      blh_min_m:
        type: "FLOAT"
        nullable: true
        range: [30.0, 2000.0]
        unit: "m"

      # Ve tinh Vien tham (TV2)
      aod_047_mean:
        type: "FLOAT"
        nullable: true
        range: [0.0, 3.5]
        unit: "unitless"
      is_aod_missing_mnar:
        type: "TINYINT"
        nullable: false
        allowedValues: [0, 1]
        description: "1 neu khuyet thieu do may che phu (Missing Not At Random)."
      no2_tropospheric_mol_m2:
        type: "FLOAT"
        nullable: true
        range: [0.0, 0.001]
        unit: "mol/m²"
      viirs_nightlight_rad:
        type: "FLOAT"
        nullable: true
        range: [0.0, 300.0]
        unit: "nW/cm²/sr"

      # Khong gian Dia ly Do thi (TV2)
      osm_primary_road_m:
        type: "FLOAT"
        nullable: false
        range: [0.0, null]
        unit: "m"
      osm_road_density_km_km2:
        type: "FLOAT"
        nullable: false
        range: [0.0, null]
        unit: "km/km²"
      worldcover_builtup_ratio:
        type: "FLOAT"
        nullable: false
        range: [0.0, 1.0]
        unit: "ratio"
      worldcover_tree_ratio:
        type: "FLOAT"
        nullable: false
        range: [0.0, 1.0]
        unit: "ratio"
      dem_elevation_mean_m:
        type: "FLOAT"
        nullable: false
        range: [-5.0, 1300.0]
        unit: "m"
      dem_slope_mean_deg:
        type: "FLOAT"
        nullable: false
        range: [0.0, 60.0]
        unit: "degrees"

# ==============================================================================
# 4. CONG KIEM DINH CHAT LUONG DU LIEU TU DONG (QUALITY ASSERTIONS)
# ==============================================================================
qualityAssertions:
  # Assertion 1: Quy mo khung xuong bat bien
  - id: "assert_exact_spine_mart_volume"
    targetModel: "mart_grid_daily_features"
    type: "row_count_exact"
    expectedValue: 6591860
    description: "Quy mo ma tran khong-thoi gian bat buoc phai bang 3.610 o x 1.826 ngay = 6.591.860 dong."

  # Assertion 2: Chống rò rỉ nhãn ML
  - id: "assert_anti_leakage_cleanliness"
    targetModel: "mart_grid_daily_features"
    type: "column_blacklist"
    forbiddenPatterns: ["*pm25*", "*pm2_5*", "*ground_truth*", "*label*"]
    description: "Bang dac trung Marts tuyet doi khong duoc chua cot PM2.5 hay bien nhan."

  # Assertion 3: Khóa chính không được có Null và phải duy nhất
  - id: "assert_primary_key_integrity"
    targetModel: "mart_grid_daily_features"
    sql: >
      SELECT COUNT(*) - COUNT(DISTINCT grid_id || '_' || CAST(date_id AS VARCHAR)) AS duplicate_keys
      FROM read_parquet('data/marts/mart_grid_daily_features.parquet')
    expectedResult: 0
    description: "Cap khoa (grid_id, date_id) phai la duy nhat 100% khong co trung lap."

  # Assertion 4: Quality Gate giờ đo trạm Fact
  - id: "assert_ground_truth_valid_day_flag"
    targetModel: "fct_ground_truth_daily"
    sql: >
      SELECT COUNT(*) AS invalid_days_count
      FROM read_parquet('data/core/fct_ground_truth_daily.parquet')
      WHERE is_valid_day IS NULL OR is_valid_day != CASE WHEN valid_hours_count >= 18 THEN 1 ELSE 0 END
    expectedResult: 0
    description: "Co 18 gio phai nhat quan voi so gio hop le; fact giu moi tram-ngay."

  # Assertion 5: Toàn vẹn khóa ngoại (Zero Orphan Stations)
  - id: "assert_zero_orphan_station_join"
    targetModel: "fct_ground_truth_daily"
    sql: >
      SELECT COUNT(*) AS orphan_count
      FROM read_parquet('data/core/fct_ground_truth_daily.parquet') f
      LEFT JOIN read_parquet('data/core/dim_station.parquet') s ON f.station_id = s.station_id
      WHERE s.station_id IS NULL
    expectedResult: 0
    description: "100% ban ghi Fact tram phai lien ket dung toi bang danh muc dim_station."

  # Assertion 6: Tỷ lệ khuyết thiếu khí tượng tối đa cho phép
  - id: "assert_meteo_null_rate_tolerance"
    targetModel: "mart_grid_daily_features"
    sql: >
      SELECT CAST(COUNT(*) FILTER (WHERE temp_2m_mean_c IS NULL) AS DOUBLE) / COUNT(*) AS temp_null_ratio
      FROM read_parquet('data/marts/mart_grid_daily_features.parquet')
    operator: "<="
    threshold: 0.05
    description: "Ty le khuyet thieu cua bien nhiet do khi hau ERA5-Land phai duoi 5%."

# ==============================================================================
# 5. RAO CHAN AN TOAN MACHINE LEARNING (ML EVALUATION GUARDRAILS)
# ==============================================================================
machineLearningGuardrails:
  targetVariable: "pm25_raw_mean" # Nhan thu nghiem; can danh gia chat luong sensor truoc khi train.
  labelSelection: "pm25_raw_mean IS NOT NULL; khong loc theo nguong 18 gio"
  temporalFeatures: ["month", "day_of_week", "is_weekend", "hanoi_season"]
  excludedTemporalFeatures: ["is_crop_burning_window"]
  excludedTrainingColumns: ["valid_hours_count", "is_valid_day"]
  featureSelectionStatus: "planned_not_implemented"
  targetUnits: "ug/m3"
  evaluationScheme: "Grouped Spatial K-Fold Cross-Validation"
  cvSpatialParameters:
    minBufferDistanceMetres: 2000
    clusterMethod: "Spatial Hierarchical Clustering (DBSCAN / Scipy Linkage)"
    kFolds: 5
  baselineModels:
    - name: "Daily Spatial Mean"
      formula: 'y_pred(s, t) = Mean_{s in S}(y(s, t))'
      expectedMaxR2: 0.45
    - name: "Inverse Distance Weighting (IDW)"
      power: 2.0
      expectedMaxR2: 0.60
    - name: "Ordinary Spatial Kriging"
      variogramModel: "Spherical / Exponential"
      expectedMaxR2: 0.65
  targetModelSuccessCriteria:
    algorithmCandidates: ["LightGBM", "CatBoost", "RandomForestRegressor"]
    spatialCvMinR2: 0.75
    spatialCvMaxRmse: 12.0
    spatialCvMaxMae: 8.0
