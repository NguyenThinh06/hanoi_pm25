services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hanoi_pm25_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hanoi_pm25}
      POSTGRES_USER: ${POSTGRES_USER:-hanoi_pm25}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanoi_pm25_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hanoi_pm25_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hanoi_pm25_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanoi_pm25_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hanoi_pm25}:${POSTGRES_PASSWORD:-hanoi_pm25_secret}@db:5432/${POSTGRES_DB:-hanoi_pm25}
      API_CORS_ORIGINS: "*"
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-300}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hanoi_pm25_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hanoi_pm25_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hanoi_pm25_net

volumes:
  hanoi_pm25_postgres_data:
    name: hanoi_pm25_postgres_data

networks:
  hanoi_pm25_net:
    name: hanoi_pm25_net
